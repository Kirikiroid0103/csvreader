<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Интерактивный дашборд анализа CSV</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header class="app-header">
    <h1>Интерактивный дашборд анализа CSV</h1>
    <p>Загрузите CSV-файл, чтобы увидеть сводку, аналитику и графики.</p>
  </header>

  <main class="container">
    <section class="card upload-card">
      <h2>Загрузка данных</h2>
      <div id="dropzone" class="dropzone">
        <p>Перетащите CSV сюда или нажмите, чтобы выбрать файл</p>
        <input id="fileInput" type="file" accept=".csv,text/csv" />
      </div>
      <div id="errorBox" class="error-box hidden"></div>
    </section>

    <section id="summaryCard" class="card hidden">
      <h2>Сводка о датасете</h2>
      <div class="summary-grid" id="summaryGrid"></div>
      <h3>Столбцы и типы</h3>
      <div class="table-wrap">
        <table id="columnsTable" class="data-table"></table>
      </div>
    </section>

    <section id="previewCard" class="card hidden">
      <h2>Первые 20 строк</h2>
      <div class="table-wrap">
        <table id="previewTable" class="data-table"></table>
      </div>
    </section>

    <section id="analyticsCard" class="card hidden">
      <h2>Аналитика</h2>
      <h3>Числовые столбцы</h3>
      <div id="numericAnalytics" class="analytics-grid"></div>
      <h3>Категориальные столбцы</h3>
      <div id="categoricalAnalytics" class="analytics-grid"></div>
    </section>

    <section id="chartsCard" class="card hidden">
      <h2>Визуализация</h2>
      <div class="controls-grid">
        <label>
          Гистограмма: числовой столбец
          <select id="histColumn"></select>
        </label>
        <label>
          Круговая диаграмма: категориальный столбец
          <select id="pieColumn"></select>
        </label>
        <label>
          Scatter: X
          <select id="scatterX"></select>
        </label>
        <label>
          Scatter: Y
          <select id="scatterY"></select>
        </label>
      </div>
      <div class="charts-grid">
        <div class="chart-box">
          <canvas id="histChart"></canvas>
        </div>
        <div class="chart-box">
          <canvas id="pieChart"></canvas>
        </div>
        <div class="chart-box chart-wide">
          <canvas id="scatterChart"></canvas>
        </div>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
